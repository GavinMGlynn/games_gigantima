# Something a person can download and run.
#
# The build matrix in ci.yml proves the code compiles and passes its tests on
# four platforms. That is not the same as a thing anybody can play: a package
# has to carry the art beside the executable, in the layout
# `src/platform/gg_paths.c` looks in, and it has to run on a machine that has
# never seen this source tree.
#
# So each job builds a package, **unpacks it somewhere else, and plays it from
# there** with the source tree out of reach and `GIGANTIMA_ASSETS` unset. A
# package that starts only because it was run from the build directory is the
# failure this is here to catch.
name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CI_SUBMODULES: ext/sdl ext/sdl_image

permissions:
  contents: write            # to attach the packages to a release

jobs:
  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libdecor-0-dev \
            libwayland-dev wayland-protocols \
            libgl-dev libegl-dev libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev

      # A tag names the release; a push to main is just "0.1.0". The packages
      # carry it, so a file in somebody's downloads folder says what it is.
      - name: What this release is called
        id: release
        run: |
          name="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) name="" ;; esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=gcc-14 \
                -DCMAKE_BUILD_TYPE=Release -DGIGANTIMA_TESTS=OFF \
                ${{ steps.release.outputs.name && format('-DGIGANTIMA_RELEASE={0}', steps.release.outputs.name) || '' }}
          cmake --build build -j

      - name: Package
        run: cd build && cpack -G TGZ

      # Unpacked into /tmp and played from /, so the only way it can find its
      # art is the one a player's copy will use.
      - name: Play the package from somewhere else
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p /tmp/unpacked
          tar -xzf build/gigantima-*-linux-*.tar.gz -C /tmp/unpacked
          dir=$(echo /tmp/unpacked/gigantima-*)
          test -f "$dir/gigantima" || { echo "no game in the package"; exit 1; }
          test -f "$dir/gigantima_editor" || { echo "no editor"; exit 1; }
          test -f "$dir/assets/atlas_tiles.png" || { echo "no art"; exit 1; }
          test -f "$dir/LICENSE" || { echo "no licence"; exit 1; }
          cd / && env -u GIGANTIMA_ASSETS "$dir/gigantima" \
            --profile Packaged --new --play --turns 40 2>&1 | tee /tmp/run.log
          grep -q "played to turn 40" /tmp/run.log || {
            echo "the packaged game did not play"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: gigantima-linux-x86_64
          path: |
            build/gigantima-*.tar.gz
            build/gigantima-*.sha256

  windows:
    name: Windows zip and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        shell: bash
        run: git submodule update --init --depth 1 $CI_SUBMODULES

      # The runner image has NSIS but does not put it on the PATH, so this
      # makes sure of it - an installer is half of what this job is for, and
      # "the zip was produced and the installer silently was not" is the
      # failure it had the first time it ran.
      - name: Make sure NSIS is there
        run: |
          if (!(Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION

      - name: What this release is called
        id: release
        shell: bash
        run: |
          name="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) name="" ;; esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGIGANTIMA_TESTS=OFF `
                ${{ steps.release.outputs.name && format('-DGIGANTIMA_RELEASE={0}', steps.release.outputs.name) || '' }}
          cmake --build build --config Release --parallel

      - name: Package
        run: cd build; cpack -C Release

      # Both of them, or the job has not done what it says.
      - name: There is a zip and an installer
        run: |
          if (!(Get-ChildItem build/gigantima-*-windows-*.zip)) { throw "no zip" }
          if (!(Get-ChildItem build/gigantima-*.exe)) { throw "no installer" }

      # And the installer is *run*, silently, and the game played out of where
      # it put itself. "An installer was produced" and "an installer installs a
      # game that runs" are different claims, and only the second one is the
      # item.
      - name: Install it, and play what it installed
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          $exe = Get-ChildItem build/gigantima-*.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList "/S","/D=C:\Gigantima" -Wait
          if (!(Test-Path "C:\Gigantima\gigantima.exe")) { throw "the installer put no game down" }
          if (!(Test-Path "C:\Gigantima\assets\atlas_tiles.png")) { throw "the installer put no art down" }
          if (!(Test-Path "C:\Gigantima\Uninstall.exe")) { throw "no way to uninstall it" }
          Set-Location C:\
          & "C:\Gigantima\gigantima.exe" --profile Installed --new --play --turns 40 2>&1 |
            Tee-Object -FilePath C:\installed.log
          if (!(Select-String -Path C:\installed.log -Pattern "played to turn 40" -Quiet)) {
            throw "the installed game did not play"
          }

      - name: Play the package from somewhere else
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          $zip = Get-ChildItem build/gigantima-*-windows-*.zip | Select-Object -First 1
          Expand-Archive -Path $zip -DestinationPath C:\unpacked
          $dir = Get-ChildItem C:\unpacked -Directory | Select-Object -First 1
          if (!(Test-Path "$($dir.FullName)\gigantima.exe")) { throw "no game in the package" }
          if (!(Test-Path "$($dir.FullName)\assets\atlas_tiles.png")) { throw "no art" }
          Remove-Item Env:GIGANTIMA_ASSETS -ErrorAction SilentlyContinue
          Set-Location C:\
          & "$($dir.FullName)\gigantima.exe" --profile Packaged --new --play --turns 40 2>&1 |
            Tee-Object -FilePath C:\run.log
          if (!(Select-String -Path C:\run.log -Pattern "played to turn 40" -Quiet)) {
            throw "the packaged game did not play"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: gigantima-windows-x86_64
          path: |
            build/gigantima-*.zip
            build/gigantima-*.exe
            build/gigantima-*.sha256

  macos:
    name: macOS bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES

      - name: What this release is called
        id: release
        run: |
          name="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) name="" ;; esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGIGANTIMA_TESTS=OFF \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                ${{ steps.release.outputs.name && format('-DGIGANTIMA_RELEASE={0}', steps.release.outputs.name) || '' }}
          cmake --build build -j3

      - name: Package
        run: cd build && cpack

      # Through the tarball rather than the disk image: it holds the same two
      # bundles, and mounting a dmg to prove a bundle runs proves the mounting.
      - name: Play the package from somewhere else
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p /tmp/unpacked
          tar -xzf build/gigantima-*-macos-*.tar.gz -C /tmp/unpacked
          dir=$(echo /tmp/unpacked/gigantima-*)
          app="$dir/gigantima.app"
          test -x "$app/Contents/MacOS/gigantima" || { echo "no game in the bundle"; exit 1; }
          test -f "$app/Contents/Resources/assets/atlas_tiles.png" || { echo "no art in the bundle"; exit 1; }
          test -d "$dir/gigantima_editor.app" || { echo "no editor bundle"; exit 1; }
          cd / && env -u GIGANTIMA_ASSETS "$app/Contents/MacOS/gigantima" \
            --profile Packaged --new --play --turns 40 2>&1 | tee /tmp/run.log
          grep -q "played to turn 40" /tmp/run.log || {
            echo "the packaged game did not play"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: gigantima-macos-arm64
          path: |
            build/gigantima-*.tar.gz
            build/gigantima-*.dmg
            build/gigantima-*.sha256

  # Only on a tag, and only once every platform has built its package *and*
  # played it. A release that goes out before the smoke tests have run is a
  # release nobody checked.
  release:
    name: Publish the release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }

      - name: Collect the packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: What there is
        run: ls -la packages

      # A beta is marked as a pre-release, so nobody downloads it thinking it
      # is finished. The notes come from CHANGELOG.md rather than being written
      # twice and drifting apart.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: gigantima ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            packages/gigantima-*.tar.gz
            packages/gigantima-*.zip
            packages/gigantima-*.exe
            packages/gigantima-*.dmg
            packages/gigantima-*.sha256
