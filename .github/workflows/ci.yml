name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build needs SDL and SDL_image and nothing else. `ext/lpc-revised` is
# 766 MB of source art and is only needed to *regenerate* the atlas, which is
# committed - so CI never checks it out. That is also what keeps the claim in
# README.md honest: a clone with only these two submodules builds and plays.
env:
  CI_SUBMODULES: ext/sdl ext/sdl_image

jobs:
  linux:
    name: Linux x86_64 (GCC 14, Debian family)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libdecor-0-dev \
            libwayland-dev wayland-protocols \
            libgl-dev libegl-dev libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=gcc-14
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGIGANTIMA_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # The tests cover the simulation; this covers everything the simulation
      # deliberately cannot touch - the atlas loading, the renderer, the HUD
      # and the asset path search. A game that passes ctest and cannot find its
      # own art is still broken.
      - name: Smoke test - render a frame headless
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/gigantima --play --seed 7 --shot smoke.bmp --shot-at 12
          test -s smoke.bmp || { echo "no frame was written"; exit 1; }

      # Saving is the one thing the unit tests cannot finish: they exercise
      # gg_save directly, but not the frontend deciding to resume, nor the exit
      # path writing on the way out. This plays, quits, and plays again.
      - name: Smoke test - save and resume
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/gigantima --play --profile CI --new --seed 7 --turns 60
          # 2>&1: the game logs through SDL_Log, which writes to stderr. Piping
          # stdout alone captured nothing and the grep below failed on a run
          # that had in fact resumed correctly.
          ./build/gigantima --play --profile CI --turns 120 2>&1 | tee resume.log
          grep -q "resumed CI" resume.log || {
            echo "the second run did not resume the first"; exit 1; }
          grep -q "turn 60" resume.log || {
            echo "resumed at the wrong turn"; cat resume.log; exit 1; }

      # Every screen has to draw. A menu that crashes or renders nothing is
      # invisible to the unit tests, which exercise the logic without a
      # renderer - so each one is opened and photographed here.
      - name: Smoke test - every screen draws
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          for s in title profiles name options keys pause play pack talk party fight spells magic sheet journal; do
            ./build/gigantima --screen "$s" --profile CI --shot "screen-$s.bmp"
            test -s "screen-$s.bmp" || { echo "$s drew nothing"; exit 1; }
          done

      # Two shipped maps with ways out into each other. The crossing itself is
      # checked by the unit tests; this is that the maps on disk are ones the
      # game will actually open and walk between.
      - name: Smoke test - walking between two maps
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/gigantima --map assets/maps/vale.map.txt --seed 3 --profile CIWalk \
            --new --play --shot-at 0 --screen travel --shot travel.bmp > travel.log 2>&1
          cat travel.log
          test -s travel.bmp || { echo "the crossing drew nothing"; exit 1; }
          grep -q "The Standing Stones" travel.log || {
            echo "walking north did not arrive at the other map"; exit 1; }

      # And that the map behind you kept what you did in it. Something is put
      # on the road, the Avatar walks out of the vale and back into it, and the
      # pile has to still be lying where it was left.
      - name: Smoke test - a map you leave is as you left it
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/gigantima --map assets/maps/vale.map.txt --seed 3 --profile CIReturn \
            --new --play --shot-at 0 --screen return --shot return.bmp > return.log 2>&1
          cat return.log
          test -s return.bmp || { echo "the return drew nothing"; exit 1; }
          grep -q "found 3 silver still at" return.log || {
            echo "what was left on the floor did not survive the round trip"; exit 1; }

      # And the whole story, played through in one run of the real game: the
      # vale is asked what is wrong, the north road is walked, the man at the
      # end of it is killed, and the caravan's silver is carried home and handed
      # back. Everything the run does goes through the ordinary turn, so a story
      # a player could not finish is one this cannot finish either.
      - name: Smoke test - the story can be played to its end
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          # A seed, because the world's dice come from the clock now and this
          # has to be the same journey every time. That a *prepared party
          # usually* wins is measured by the balance test; this proves the
          # story can be finished at all, deterministically.
          ./build/gigantima --map assets/maps/vale.map.txt --seed 3 --profile CIEnd \
            --new --play --shot-at 0 --screen ending --shot ending.bmp > ending.log 2>&1
          cat ending.log
          test -s ending.bmp || { echo "the ending drew nothing"; exit 1; }
          grep -q "Rugar has fallen" ending.log || {
            echo "the man at the end of the road was not beaten"; exit 1; }
          grep -q "the story ended" ending.log || {
            echo "the story could not be played to its end"; exit 1; }

      # And that a session can be recorded and played back to the same world.
      # The story run above is recorded this time, then replayed: 500-odd
      # actions, two crossings and a fight, and the replay has to end on the
      # same state hash. A divergence here is a bug in determinism itself.
      - name: Smoke test - a recorded session replays to the same world
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/gigantima --map assets/maps/vale.map.txt --seed 3 --profile CIRec \
            --new --play --shot-at 0 --screen ending --record story.ggreplay \
            --shot recorded.bmp > record.log 2>&1
          grep -q "recorded" record.log || { cat record.log; exit 1; }
          ./build/gigantima --replay story.ggreplay > replay.log 2>&1
          cat replay.log
          grep -q "identical" replay.log || {
            echo "the replay did not end on the world it was recorded from"
            exit 1; }

      # Every screen again with the larger text, which is a different layout
      # and not the same one scaled: a row that fits at the baked size and runs
      # off the bottom at twice it is a setting that makes the game *less*
      # playable, which is the opposite of the point.
      - name: Smoke test - every screen draws with large text
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
          XDG_DATA_HOME: ${{ runner.temp }}/bigprefs
        run: |
          mkdir -p "$XDG_DATA_HOME/gigantima/gigantima"
          printf 'text_scale = 2\n' > "$XDG_DATA_HOME/gigantima/gigantima/settings.txt"
          for s in title profiles name options keys pause play pack talk spells sheet journal; do
            ./build/gigantima --screen "$s" --profile CIBig --new --shot "big-$s.bmp"
            test -s "big-$s.bmp" || { echo "$s drew nothing at large text"; exit 1; }
          done

      # And that a controller is not the poor relation. A **virtual** gamepad
      # is attached through SDL and the game is played with it and nothing
      # else: title, new journey, a name typed on the on-screen alphabet, a
      # walk about the world, every verb the pad carries, then pause, save and
      # leave. The keyboard is never touched, which is the plan's own
      # verification for the item and not something a person has to remember to
      # re-run by hand.
      - name: Smoke test - a whole journey with a pad and no keyboard
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
          # Its own preferences directory, so the journeys it names cannot
          # collide with a previous run's.
          XDG_DATA_HOME: ${{ runner.temp }}/padprefs
        run: |
          ./build/gigantima --pad-loop > pad.log 2>&1
          cat pad.log
          grep -q "played a whole journey and saved it" pad.log || {
            echo "the pad could not get from the title to a saved journey"
            exit 1; }

      # The editor is a second binary on the same core, and it has to keep
      # building and drawing. The map it authors being playable is checked by
      # the unit tests; this is the window.
      - name: Smoke test - the editor draws
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          ./build/gigantima_editor --size 64 64 --shot editor.bmp
          test -s editor.bmp || { echo "the editor drew nothing"; exit 1; }

      # The world has to make a noise, and the volume rows have to change what
      # it is. Captured through SDL's disk audio driver rather than a device:
      # the only way to check sound on a machine with no speakers, which is
      # every machine CI runs on.
      - name: Smoke test - the world can be heard, and turned down
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: disk
        run: |
          set -e
          settings="$HOME/.local/share/gigantima/gigantima/settings.txt"
          mkdir -p "$(dirname "$settings")"

          # Written with printf rather than a heredoc: a quoted heredoc
          # terminator has to start at column zero, and every line inside a
          # YAML block is indented.
          printf '%s\n' \
            'import struct, math' \
            'raw = open("sdlaudio.raw", "rb").read()' \
            'n = len(raw) // 2' \
            'v = struct.unpack("<%dh" % n, raw) if n else ()' \
            'print(int(math.sqrt(sum(x * x for x in v) / n)) if n else 0)' \
            > rms.py

          measure() {   # $1 music, $2 effects; prints the RMS of the capture
            printf 'scale = 2\nfullscreen = 0\nrumble = 1\nmusic = %s\neffects = %s\n' \
              "$1" "$2" > "$settings"
            rm -f sdlaudio.raw
            ./build/gigantima --seed 9001 --profile CIEar --new --play \
              --turns 40 --listen 1200 > /dev/null 2>&1
            python3 rms.py
          }

          both=$(measure 8 8)
          music=$(measure 8 0)
          effects=$(measure 0 8)
          silent=$(measure 0 0)
          echo "rms: both=$both music=$music effects=$effects silent=$silent"

          test "$silent" -eq 0 || { echo "everything off is not silent"; exit 1; }
          test "$music" -gt 0   || { echo "the music makes no sound"; exit 1; }
          test "$effects" -gt 0 || { echo "the effects make no sound"; exit 1; }
          test "$both" -gt "$music"   || { echo "effects added nothing"; exit 1; }
          test "$both" -gt "$effects" || { echo "music added nothing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux-frame
          path: |
            smoke.bmp
            screen-*.bmp
            editor.bmp
            travel.bmp

  rocky:
    name: Linux x86_64 (GCC 14, RHEL family)
    runs-on: ubuntu-latest
    # `rockylinux:10` is not a real Docker Hub tag - the image lives
    # under the org-scoped name. The failure reads "manifest unknown".
    container: rockylinux/rockylinux:10
    steps:
      - name: Install dependencies
        run: |
          # The stock Rocky image has neither CRB nor EPEL enabled, and the
          # build needs both: ninja-build and the wayland protocol headers live
          # in CRB, libXScrnSaver-devel in EPEL. Without them dnf reports only
          # "No match for argument", which says nothing about which repository
          # is missing.
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False \
            gcc cmake ninja-build git \
            libX11-devel libXext-devel libXrandr-devel libXcursor-devel \
            libXi-devel libXfixes-devel libXScrnSaver-devel libXtst-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel \
            mesa-libGL-devel mesa-libEGL-devel \
            pulseaudio-libs-devel alsa-lib-devel \
            dbus-devel systemd-devel libusb1-devel
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --depth 1 $CI_SUBMODULES
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
                   -DGIGANTIMA_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  # Clang, on Linux, where it costs two minutes rather than a macOS runner.
  #
  # GCC and Clang do not warn about the same things: an implicit conversion
  # that changes signedness is fatal under Clang's -Wsign-conversion and
  # invisible under GCC's, so a clean build here used to mean nothing until the
  # macOS job said otherwise, at the far end of the matrix. The same lesson as
  # the MSVC one in COMPLETION_PLAN.md: a warning that fires on one compiler
  # and not another is a lint somebody has to be able to run.
  clang:
    name: Linux x86_64 (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES

      # clang-19 by name: the runner's plain `clang` is 18, which the C23 gate
      # in cmake/Platform.cmake refuses - correctly, and this job's first run
      # was refused by it.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libdecor-0-dev \
            libwayland-dev wayland-protocols \
            libgl-dev libegl-dev libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-19
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGIGANTIMA_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        shell: bash
        run: git submodule update --init --depth 1 $CI_SUBMODULES
      # No -G: the runner image changes which Visual Studio it ships, so let
      # CMake pick the newest installed one rather than naming a version.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGIGANTIMA_WERROR=ON
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C RelWithDebInfo
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/**/gigantima.exe

  macos:
    name: macOS arm64 (AppleClang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGIGANTIMA_WERROR=ON
                   -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build -j3
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/gigantima

  sanitizers:
    name: Address + UB sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Checkout build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libdecor-0-dev \
            libwayland-dev wayland-protocols \
            libgl-dev libegl-dev libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev

      # Debug rather than release: ASan's reports are only as good as the frame
      # pointers and line numbers it has, and -O2 loses both.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=gcc-14
                   -DCMAKE_BUILD_TYPE=Debug -DGIGANTIMA_ASAN=ON -DGIGANTIMA_WERROR=ON
      - name: Build
        run: cmake --build build -j

      # halt_on_error keeps a UBSan report from being a line of output nobody
      # reads: without it the job goes green with the defect printed halfway up.
      - name: Unit tests under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.lsan-suppressions.txt
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure

      - name: Headless render under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.lsan-suppressions.txt
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: ./build/gigantima --play --seed 3 --shot asan.bmp --shot-at 25
